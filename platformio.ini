; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack_stamp_c3]
; Versions are pinned so the project builds the same way every time.
platform = espressif32 @ 8.0.0
framework = arduino
board = m5stack-stamp-c3
; The official board file defaults to qio; this device was tested with dio.
board_build.flash_mode = dio
board_build.partitions = default.csv
monitor_speed = 115200
; The Stamp-C3 connects over a CH9102 USB-to-serial chip, so send Serial to
; the UART pins rather than the C3's built-in USB (the board file's default).
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0 ;0:None, 1:Error, 2:Warn, 3:Info, 4:Debug, 5:Verbose
lib_deps =
  adafruit/Adafruit NeoPixel @ 1.15.5
